<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 880" width="1000" height="880" role="img" aria-label="Agentic RAG 多智能体流程图">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="880" rx="18" fill="#ffffff" stroke="#e5e7eb"/>

  <text x="36" y="46" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#0f172a">Traceable Biomed Agentic RAG · 生物医学多智能体流程</text>
  <text x="36" y="70" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#64748b">LangGraph 状态机 · 四域并行召回 → 跨域融合 → 反思验收 → 仅凭证据生成；附工具选择与人工确认断点</text>

  <!-- 输入 -->
  <rect x="260" y="104" width="480" height="44" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="500" y="131" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a">用户问题</text>
  <line x1="500" y1="148" x2="500" y2="172" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Orchestrator -->
  <rect x="260" y="174" width="480" height="54" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="280" y="197" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#1e3a8a">Orchestrator</text>
  <text x="280" y="215" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#475569">领域识别 · 数据域路由（召回优先）· 输出执行计划</text>
  <line x1="500" y1="228" x2="500" y2="252" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Query Rewriter -->
  <rect x="260" y="254" width="480" height="54" rx="10" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="280" y="277" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#4c1d95">Query Rewriter</text>
  <text x="280" y="295" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#475569">缩写消歧（MS = 多发性硬化 / 质谱）· 多查询扩展 · 反思定向补充</text>
  <line x1="500" y1="308" x2="500" y2="332" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 四个数据域专家 -->
  <text x="266" y="329" text-anchor="start" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#94a3b8">并行 4 路 · 不调用 LLM</text>
  <rect x="260" y="334" width="112" height="88" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="316" y="362" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#065f46">literature</text>
  <text x="316" y="381" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#475569">期刊 / 系统评价</text>
  <text x="316" y="400" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#94a3b8">pubmed_search</text>

  <rect x="382" y="334" width="112" height="88" rx="10" fill="#ecfeff" stroke="#67e8f9"/>
  <text x="438" y="362" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#155e75">clinical</text>
  <text x="438" y="381" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#475569">临床试验</text>
  <text x="438" y="400" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#94a3b8">trials_lookup</text>

  <rect x="504" y="334" width="112" height="88" rx="10" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="560" y="362" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#78350f">report</text>
  <text x="560" y="381" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#475569">病理 / 影像报告</text>
  <text x="560" y="400" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#94a3b8">report_lookup</text>

  <rect x="626" y="334" width="114" height="88" rx="10" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="683" y="362" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#4c1d95">kg</text>
  <text x="683" y="381" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#475569">概念图谱</text>
  <text x="683" y="400" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#94a3b8">umls_expand</text>

  <!-- 汇聚到 fuse -->
  <line x1="316" y1="422" x2="440" y2="446" stroke="#64748b" stroke-width="1.4"/>
  <line x1="438" y1="422" x2="480" y2="446" stroke="#64748b" stroke-width="1.4"/>
  <line x1="560" y1="422" x2="520" y2="446" stroke="#64748b" stroke-width="1.4"/>
  <line x1="683" y1="422" x2="560" y2="446" stroke="#64748b" stroke-width="1.4"/>
  <line x1="500" y1="422" x2="500" y2="446" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Fuse -->
  <rect x="260" y="448" width="480" height="54" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="280" y="471" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#7c2d12">Fuse（跨域融合）</text>
  <text x="280" y="489" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#475569">doc_id 去重 → 覆盖度 0.6 + 域内分 0.4 重排 → 低于最佳 50% 截断 → Top 8</text>
  <line x1="500" y1="502" x2="500" y2="526" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Critic -->
  <rect x="260" y="528" width="480" height="54" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="280" y="551" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#7f1d1d">Critic（反思验收）</text>
  <text x="280" y="569" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#475569">高等级证据 ≥1 · 独立数据源 ≥2 · 命中查询实体 ≥2（不调 LLM）</text>
  <line x1="500" y1="582" x2="500" y2="606" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="512" y="600" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#16a34a">证据充分</text>

  <!-- Generate -->
  <rect x="260" y="608" width="480" height="54" rx="10" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="280" y="631" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#1e3a8a">Generate</text>
  <text x="280" y="649" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#475569">只用检索证据作答 · 引用 ID 必须存在于证据集，否则丢弃</text>
  <line x1="500" y1="662" x2="500" y2="686" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Answer -->
  <rect x="260" y="688" width="480" height="58" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="500" y="712" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a">答案 + 证据来源</text>
  <text x="500" y="731" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#64748b">每条结论可追溯到 doc_id；证据不足时明确标注而不是硬编</text>

  <!-- 反思回流 -->
  <path d="M 260 551 L 210 551 L 210 281 L 256 281" fill="none" stroke="#ef4444" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrowRed)"/>
  <text x="200" y="404" text-anchor="end" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#ef4444">证据不足</text>
  <text x="200" y="421" text-anchor="end" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#ef4444">回流重写</text>
  <text x="200" y="438" text-anchor="end" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#f87171">≤ MAX_REFLECTIONS</text>
  <text x="200" y="455" text-anchor="end" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#f87171">证据去重累积</text>

  <!-- 可选能力：工具选择 + 人工确认断点 -->
  <path d="M 740 555 L 768 555" fill="none" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <rect x="770" y="470" width="194" height="202" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-dasharray="5 4"/>
  <text x="784" y="492" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#92400e">可选能力（按需开启）</text>

  <text x="784" y="516" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#0f172a">tool_use · LLM 自主选工具</text>
  <text x="784" y="532" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#475569">模型看工具 schema 决定调哪个</text>
  <text x="784" y="546" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#475569">→ Pydantic 校验 → dispatch</text>
  <text x="784" y="560" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#475569">→ 同域重排 → 并入证据融合</text>

  <line x1="784" y1="572" x2="950" y2="572" stroke="#e5e7eb" stroke-width="1"/>

  <text x="784" y="590" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#0f172a">human_review · 人工确认</text>
  <text x="784" y="606" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#475569">Critic 判不足且还能再检索时</text>
  <text x="784" y="620" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#475569">interrupt() 暂停，检查点保留</text>
  <text x="784" y="634" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#475569">resume：approve / refine /</text>
  <text x="784" y="648" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#475569">abort，从断点续跑不重头执行</text>
  <text x="784" y="664" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#94a3b8">HITL_ENABLED=1 · 默认关</text>

  <!-- 底部说明带 -->
  <rect x="36" y="774" width="928" height="76" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="56" y="798" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#0f172a">共享检索底座</text>
  <text x="150" y="798" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#475569">BM25 精确匹配 + Qdrant HNSW 向量检索 + KG 概念扩展 → RRF 融合 → Cross-Encoder 重排 → 证据窗口截取</text>
  <text x="56" y="822" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#0f172a">三道防线</text>
  <text x="110" y="822" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#475569">检索侧混合+重排控输入噪声 · 生成侧引用 ID 校验 · 验收侧 Critic 判证据等级；语料外问题判"证据不足"而非硬答</text>
  <text x="56" y="844" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#94a3b8">实测（12 条金标集，默认配置，离线可复现）：Recall@5 0.910 · MRR 0.958 · Precision@5 0.786 · 引用准确率 0.799 · 证据充分率 0.833</text>
</svg>
