name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      # 评测与测试全部离线可跑：Mock 规则引擎 + 内存 Qdrant，不需要任何 API Key
      LLM_PROVIDER: mock
      QDRANT_PATH: ":memory:"
      VERBOSE: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[real-vector]" ruff

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: Retrieval evaluation (offline)
        run: python eval.py

      - name: End-to-end smoke (mock LLM)
        run: python run.py "MS 的诊断标准是什么？"
